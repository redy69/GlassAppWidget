name: Build GlassAppWidget

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: unzip -o GlassAppWidget-CloudBuild.zip

      - name: Build APK
        run: cd GlassAppWidget && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GlassAppWidget-APK
          path: GlassAppWidget/app/build/outputs/apk/debug/app-debug.apk
